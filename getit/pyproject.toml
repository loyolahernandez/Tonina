[project]
name = "getit"
version = "0.1.0"
description = "Descarga música desde YouTube (con metadata de Spotify) como AIFF etiquetado para rekordbox. Uso personal."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "yt-dlp>=2025.1.1",
    "mutagen>=1.47",
    "spotipy>=2.24",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
getit = "getit.main:run"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/getit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
