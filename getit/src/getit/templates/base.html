<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}getit{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
      --accent: #2f5d50; --accent-text: #ffffff; --ok: #2e7d4f; --warn: #a86b00; --bad: #b3261e; --info: #335c99;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9b9a94; --line: #34332f;
        --accent: #7fc1a9; --accent-text: #10201a; --ok: #6cc28f; --warn: #e0a73a; --bad: #ef7a72; --info: #8fb2ea;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
    header a.brand { font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
    header nav { margin-left: auto; display: flex; gap: 16px; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
    a { color: var(--accent); }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 28px 0 10px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input[type=text], input[type=url], input[type=number], select {
      font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
      border-radius: 6px; padding: 7px 9px; min-width: 0; }
    input.grow { flex: 1 1 320px; }
    button, .button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
      border-radius: 6px; padding: 7px 12px; cursor: pointer; text-decoration: none; white-space: nowrap; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    button.link { border: none; background: none; color: var(--accent); padding: 2px 4px; font-size: 13px; }
    .alert { border-radius: 8px; padding: 10px 12px; margin: 12px 0; border: 1px solid; }
    .alert.error { border-color: var(--bad); color: var(--bad); }
    .alert.ok { border-color: var(--ok); color: var(--ok); }
    .alert.note { border-color: var(--line); color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
    .table-wrap { overflow-x: auto; }
    .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
            border: 1px solid currentColor; white-space: nowrap; }
    .s-done { color: var(--ok); } .s-error, .s-failed { color: var(--bad); } .s-review { color: var(--warn); }
    .s-downloading, .s-queued, .s-matching, .s-analyzing { color: var(--info); }
    .s-pending, .s-reviewing { color: var(--text); }
    .s-skipped_duplicate, .s-excluded { color: var(--muted); }
    .meta input { width: 100%; margin-bottom: 4px; }
    .diff-ok { color: var(--ok); } .diff-warn { color: var(--warn); } .diff-bad { color: var(--bad); }
    .stats { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0 14px; }
    .stats b { font-size: 18px; }
    tr.dim td { opacity: .55; }
    label.check { display: flex; gap: 8px; align-items: center; }
    .form-grid { display: grid; gap: 14px; max-width: 640px; }
    .form-grid label > span { display: block; font-weight: 600; margin-bottom: 4px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">getit</a>
    <span class="muted small">música lista para rekordbox · uso personal</span>
    <nav><a href="/">Inicio</a><a href="/settings">Ajustes</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
